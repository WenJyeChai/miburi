# Exhaustive T2 reset-suffix future teacher using the released all-speaker
# BEATX setup. The temporal teacher sees the complete paired audio/text memory
# and a freshly reset-encoded ground-truth gesture suffix after a 400 ms guard.
# All 120 eligible target positions in every 10-second clip are cached.
project_name: gtdm3_resetfuture400ms_fullsuffix_t120_fullcondition_oneq0_allspk_beatx_bf16

is_train: True
ddp: False

beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/
deps_path: assets_dep/

# Reuse the chunked HDF5 used by the all-speaker release run. Gesture codec
# tokens are not baked into this HDF5; the reset cache below is codec-specific.
cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5
beatx_cache_path: datasets/data_cache/beatx_gtdm3/database.hdf5
embody3d_cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5

# Match experiments/allspk_release_gtdm3_exp/config.yaml exactly.
lowerbodycodec_ckpt: experiments/allspk_release_lowertranscodec/last_705.safetensors
upperbodycodec_ckpt: experiments/allspk_release_uppercodec/last_490.safetensors
facecodec_ckpt: experiments/allspk_release_facecodec/last_380.safetensors

# This is a new privileged teacher, not a continuation of the release model.
is_continue: False
out_path: ./experiments/
dataset: unified
dataset_ratio: full_beatx_lowervalid
pose_norm: False
body_part: full

motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106

random_seed: 2342
pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1

# 10 motion frames at 25 FPS = 400 ms = five gesture tokens. Zero future
# window means reveal the complete remaining reset-encoded suffix.
future_gesture_horizon_frames: 10
future_motion_mode: reset
future_window_ms: 0
future_segment_embedding: False
reset_prefix_drop_tokens: 0

# 250 / 2 = 125 gesture positions; the five-token guard leaves targets
# t=0..119. The manifest cycles all targets once every 120 epochs.
reset_future_cache_dir: datasets/data_cache/beatx/reset_future_allspk_fullsuffix_t120_allspkcodec
reset_future_cache_mode: required
reset_future_targets_per_clip: 120
reset_future_manifest_seed: 2342
reset_future_cache_splits: [train, val]
reset_future_cache_shard_targets: 8192
reset_future_cache_build_batch_size: 16
reset_future_cache_codec_batch_size: 128
reset_future_cache_build_workers: 4
reset_future_cache_compression: gzip

transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: bfloat16
optim_dtype: float32

batch_size: 128
lr_base: 0.0001
loader_workers: 16
grad_norm: 1.0
opt: adamw
opt_betas: [0.9, 0.95]
weight_decay: 0.0
lr_policy: step
lr_min: 0.000001

pretrain_warmup_epochs: 50
inputtoken_noise_prob: 0.0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0.0

drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1

# The ordinary contrastive objective spans all timesteps and is intentionally
# disabled for the selected-target privileged teacher. It remains enabled in
# the causal student below.
gan_loss_weight: 0.0
contrastive_loss_weight: 0.0
genrecon_loss_weight: 0.0

vad_guidance: True
vad_use_face_logits: False
vad_loss_weight: 0.05

trainer: UpperFaceLowerGTDM3ResetFuture
face_loss_weight: 2.5

textaudio_emb_freeze: False
varying_frame_length: True
align_first_frame_yaw: False

cfg_dropout_prob: 0.0
cfg_scale: 4.0

epochs: 10000
decay_epochs: 500
decay_rate: 0.8
test_period: 20
log_period: 25
