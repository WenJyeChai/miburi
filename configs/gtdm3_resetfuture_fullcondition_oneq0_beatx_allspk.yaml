# T2 raw reset-suffix future teacher.
#
# This keeps the existing T1 full-condition teacher architecture and selected-
# frame objective. History/labels come from the intact full-clip encoding, the
# target plus 400 ms guard is masked, and the complete remaining upper/lower/
# face suffix is re-encoded from globally preprocessed raw motion with no live
# codec streaming state. The first lower-body suffix velocity is
# zeroed so no derivative crosses the protected interval.
project_name: gtdm3_resetfuture400ms_fullsuffix_t8_fullcondition_oneq0_beatx_bf16

is_train: True
ddp: False
beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/

deps_path: assets_dep/

cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5
beatx_cache_path: datasets/data_cache/beatx/database.hdf5
embody3d_cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5

lowerbodycodec_ckpt: experiments/allspk_release_lowertranscodec/last_705.safetensors
upperbodycodec_ckpt: experiments/allspk_release_uppercodec/last_490.safetensors
facecodec_ckpt: experiments/allspk_release_facecodec/last_380.safetensors

is_continue: False

out_path: ./experiments/
dataset: unified
pose_norm: False
body_part: full

motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106

random_seed: 2342

pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1

# 10 motion frames / 25 FPS = 400 ms = five gesture tokens.
future_gesture_horizon_frames: 10
future_motion_mode: reset
# Zero reveals the complete remaining reset-encoded suffix.
future_window_ms: 0
future_segment_embedding: False
# Primary experiment. Change only this value to 1 for the boundary ablation.
reset_prefix_drop_tokens: 0

# Offline fixed-manifest reset-token cache. Each 10-second clip has eight
# reproducible target positions; one is selected per training epoch and all
# eight are cycled over time. Prefix-drop is applied at training time, so the
# same cache supports both the 0- and 1-token boundary experiments.
reset_future_cache_dir: datasets/data_cache/beatx/reset_future_fullsuffix_t8_seed2342
reset_future_cache_mode: required
reset_future_targets_per_clip: 8
reset_future_manifest_seed: 2342
reset_future_cache_splits: [train, val]
reset_future_cache_shard_targets: 8192
reset_future_cache_build_batch_size: 8
reset_future_cache_build_workers: 4
reset_future_cache_compression: gzip

transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: "bfloat16"
optim_dtype: "float32"

lr_base: 1e-4
loader_workers: 16
grad_norm: 1.0
opt: adamw
lr_policy: step

pretrain_warmup_epochs: 50
inputtoken_noise_prob: 0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0

drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1

gan_loss_weight: 0.0
contrastive_loss_weight: 0.0
genrecon_loss_weight: 0.0

vad_guidance: True
vad_use_face_logits: False
vad_loss_weight: 0.05

trainer: UpperFaceLowerGTDM3ResetFuture
face_loss_weight: 2.5

dataset_ratio: full_beatx_lowervalid

textaudio_emb_freeze: False
varying_frame_length: False
align_first_frame_yaw: True

epochs: 10000
decay_epochs: 500
test_period: 20
decay_rate: 0.8
log_period: 25
