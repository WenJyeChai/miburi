# Ordinary causal all-speaker MIBURI student distilled from the exhaustive T2
# teacher configured in gtdm3_resetfuture_fullcondition_oneq0_beatx_allspk_t120.yaml.
# Only the frozen teacher receives the cached reset suffix and future context.
project_name: gtdm3_resetregret400ms_fullsuffix_t120_allspk_beatx_bf16

is_train: True
ddp: False

beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/
deps_path: assets_dep/

cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5
beatx_cache_path: datasets/data_cache/beatx_gtdm3/database.hdf5
embody3d_cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5

# Match the all-speaker release and the new T2 teacher.
lowerbodycodec_ckpt: experiments/allspk_release_lowertranscodec/last_705.safetensors
upperbodycodec_ckpt: experiments/allspk_release_uppercodec/last_490.safetensors
facecodec_ckpt: experiments/allspk_release_facecodec/last_380.safetensors

# The causal student trains from scratch. Supply the completed T2 checkpoint
# through --regret_teacher_ckpt when launching this config.
is_continue: False
regret_teacher_ckpt: null

out_path: ./experiments/
dataset: unified
dataset_ratio: full_beatx_lowervalid
pose_norm: False
body_part: full

motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106

random_seed: 2342
pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1

transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: bfloat16
optim_dtype: float32

batch_size: 128
lr_base: 0.0001
loader_workers: 16
grad_norm: 1.0
opt: adamw
opt_betas: [0.9, 0.95]
weight_decay: 0.0
lr_policy: step
lr_min: 0.000001

pretrain_warmup_epochs: 50
inputtoken_noise_prob: 0.0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0.0

drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1

# Preserve the released causal student's auxiliary objectives.
gan_loss_weight: 0.0
contrastive_loss_weight: 0.1
genrecon_loss_weight: 0.0

vad_guidance: True
vad_use_face_logits: False
vad_loss_weight: 0.05

trainer: UpperFaceLowerGTDM3ResetRegret
face_loss_weight: 2.5

textaudio_emb_freeze: False
varying_frame_length: True
align_first_frame_yaw: False

cfg_dropout_prob: 0.0
cfg_scale: 4.0

# The teacher/cache information boundary must exactly match the T2 run.
regret_future_horizon_frames: 10
future_gesture_horizon_frames: 10
future_window_ms: 0
reset_prefix_drop_tokens: 0
reset_future_cache_dir: datasets/data_cache/beatx/reset_future_allspk_fullsuffix_t120_allspkcodec
reset_future_cache_mode: required
reset_future_targets_per_clip: 120
reset_future_manifest_seed: 2342
reset_future_cache_splits: [train, val]

# Forward KL begins after the ordinary 50-epoch causal warm-up.
regret_temperature: 1.0
regret_weight: 1.0
regret_initial_weight: 0.1
regret_ramp_epochs: 15
regret_start_epoch: 50

epochs: 10000
decay_epochs: 500
decay_rate: 0.8
test_period: 20
log_period: 25
