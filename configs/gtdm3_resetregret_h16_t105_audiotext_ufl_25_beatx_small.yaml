# Causal good-speaker student distilled from the fixed-window T2 checkpoint.
# The student receives ordinary causal MIBURI inputs. Only the frozen teacher
# receives the cached 400-ms-offset, 16-token reset-future view.
project_name: gtdm3_resetregret400ms_h16_t105_goodspk_beatx_bf16

is_train: True
ddp: False

beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/
deps_path: assets_dep/

cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5
beatx_cache_path: datasets/data_cache/beatx_gtdm3/database.hdf5
embody3d_cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5

# These must match both the student dataset and the frozen teacher/cache.
lowerbodycodec_ckpt: experiments/demoexp_release_lowercodec/last_440.safetensors
upperbodycodec_ckpt: experiments/demoexp_release_uppercodec/last_180.safetensors
facecodec_ckpt: experiments/demoexp_release_facecodec/last_100.safetensors

is_continue: False
out_path: ./experiments/
dataset: unified
pose_norm: False
body_part: full

motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106

random_seed: 2342
pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1

transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: "bfloat16"
optim_dtype: "float32"

# Match gtdm3_audiotext_ufl_25_beatx_small.yaml.
batch_size: 128
lr_base: 1e-4
loader_workers: 16
grad_norm: 1.0
opt: adamw
lr_policy: step

pretrain_warmup_epochs: 50
inputtoken_noise_prob: 0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0

drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1

# These are ordinary causal-student auxiliaries; the frozen teacher only
# contributes its selected-target q0 KL.
gan_loss_weight: 0.0
contrastive_loss_weight: 0.1
genrecon_loss_weight: 0.0
vad_guidance: True
vad_use_face_logits: True
vad_loss_weight: 0.05

trainer: UpperFaceLowerGTDM3ResetRegret
face_loss_weight: 2.5
dataset_ratio: goodspk_beatx_lowervalid

textaudio_emb_freeze: False
varying_frame_length: False
align_first_frame_yaw: True

# Frozen H16/T105 teacher and the exact reset-code cache used to train it.
regret_teacher_ckpt: /home/wenjye/miburi/experiments/0803_0007_gtdm3_resetfuture400ms_h16_t105_fullcondition_oneq0_goodspk_beatx_bf16/last_1250.safetensors
regret_future_horizon_frames: 10
future_gesture_horizon_frames: 10
future_window_ms: 1280
reset_prefix_drop_tokens: 0
reset_future_cache_dir: datasets/data_cache/beatx/reset_future_goodspk_h16_t105
reset_future_cache_mode: required
reset_future_targets_per_clip: 105
reset_future_manifest_seed: 2342
reset_future_cache_splits: [train, val]

regret_temperature: 1.0
regret_weight: 1.0
regret_initial_weight: 0.1
regret_ramp_epochs: 15
# Train normal causal MIBURI for 50 epochs, then activate distillation.
regret_start_epoch: 50

epochs: 10000
decay_epochs: 2000
test_period: 250
decay_rate: 0.8
log_period: 10
