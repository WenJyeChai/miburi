# Paired future-content training: past_as_future.
# Historical GlobalRegret speech visibility, not the later condition-C policy.
project_name: gtdm3_futurecontext_past_as_future_allspk_bf16
trainer: UpperFaceLowerGTDM3FutureContextRegretRVQ

is_train: True
ddp: False
is_continue: False
out_path: ./experiments/
dataset: unified
dataset_ratio: full_beatx_lowervalid

beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/
deps_path: assets_dep/
cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5
beatx_cache_path: datasets/data_cache/beatx_gtdm3/database.hdf5
embody3d_cache_path: datasets/data_cache/embody3d_dyadic/database.hdf5

# Same released all-speaker codecs in all four runs; no Scott-only retraining.
lowerbodycodec_ckpt: experiments/allspk_release_lowertranscodec/last_705.safetensors
upperbodycodec_ckpt: experiments/allspk_release_uppercodec/last_490.safetensors
facecodec_ckpt: experiments/allspk_release_facecodec/last_380.safetensors

pose_norm: False
body_part: full
motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106
random_seed: 2342
pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1
gestureformer_depformer_weights_per_step: True
transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: "bfloat16"
optim_dtype: "float32"

# Single GPU: global batch 64; keep the same device count in both controls.
batch_size: 64
loader_workers: 8
lr_base: 1.0e-4
lr_min: 1.0e-6
grad_norm: 1.0
opt: adamw
weight_decay: 0.0
lr_policy: step
warmup_epochs: 0
pretrain_warmup_epochs: 0
epochs: 10000
decay_epochs: 2000
decay_rate: 0.8
test_period: 20
log_period: 10

inputtoken_noise_prob: 0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0
drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1
gan_loss_weight: 0.0
contrastive_loss_weight: 0.1
genrecon_loss_weight: 0.0
vad_guidance: True
vad_use_face_logits: True
vad_loss_weight: 0.05
face_loss_weight: 2.5
textaudio_emb_freeze: False
varying_frame_length: False
align_first_frame_yaw: True

# Only speech privilege: no future-gesture distillation.
dense_future_gesture_weight: 0.0
regret_temperature: 1.0
regret_start_epoch: 0
regret_ramp_epochs: 1
regret_include_depth_levels: True

# q0 remains canonical hard CE; RVQ regularization treats depth heads 1..19.
kinematic_rvq_topk: 8
kinematic_rvq_temperature: 0.5
kinematic_rvq_start_epoch: 0
kinematic_rvq_ramp_epochs: 1
kinematic_rvq_distance_chunk_size: 4096

wandb_project: miburi_multi
wandb_group: allspk-future-content-control

# Component switches. Zero both values when disabling a component.
regret_weight: 6.0
regret_initial_weight: 0.6
kinematic_rvq_sample_probability: 0.15
kinematic_rvq_soft_target_weight: 0.5
wandb_name: allspk-futurecontext-past_as_future-bs64


# Paired controls: only the teacher future content differs.
regret_future_context: past_as_future
regret_context_targets: 4
wandb_mode: offline
