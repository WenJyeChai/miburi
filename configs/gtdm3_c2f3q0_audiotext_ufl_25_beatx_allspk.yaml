# Experimental model only: the released Miburi config/model remain unchanged.
project_name: gtdm3_c2f3q0_global_ulf_audiotext_scratch

is_train: True
ddp: False
beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/
deps_path: assets_dep/

# Training HDF5 (fixed pose_length chunks), not the full-sequence eval HDF5.
beatx_cache_path: datasets/data_cache/beatx_train/database.hdf5
embody3d_cache_path: null

# The three gesture codecs remain pretrained/frozen tokenizers. Only the new
# gesture LM architecture is initialized and trained from scratch.
lowerbodycodec_ckpt: experiments/allspk_release_lowertranscodec/last_705.safetensors
upperbodycodec_ckpt: experiments/allspk_release_uppercodec/last_490.safetensors
facecodec_ckpt: experiments/allspk_release_facecodec/last_380.safetensors
is_continue: False

out_path: ./experiments/
dataset: unified
dataset_ratio: full_beatx_lowervalid
pose_norm: False
body_part: full
motion_fps: 25
pose_length: 250
frame_chunk_size: 2
audio_sr: 24000
audio_fps: 24000
lowertrans_nfeats: 61
upperlower_nfeats: 258
face_nfeats: 106
random_seed: 2342

# Same backbone sizes as current Miburi; only the factorisation is changed.
gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1
transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 3
trainer: UpperFaceLowerGTDM3C2F

param_dtype: "bfloat16"
optim_dtype: "float32"
lr_base: 1e-4
loader_workers: 16
grad_norm: 1.0
opt: adamw
lr_policy: step

inputtoken_noise_prob: 0
memory_dropout_prob: 0.1
memory_embnoise_prob: 0
drop_lower_crossattn: True
lower_bodypart_dropprob: 0.1

gan_loss_weight: 0.0
contrastive_loss_weight: 0.1
genrecon_loss_weight: 0.0
face_loss_weight: 2.5
vad_guidance: True
vad_use_face_logits: False
vad_loss_weight: 0.05

# Canonical CE first; detached self-forced prefixes then ramp to p=0.5.
c2f_self_forcing: True
c2f_self_forcing_warmup_ratio: 0.1
c2f_self_forcing_ramp_ratio: 0.3
c2f_self_forcing_max_prob: 0.5
soft_recovery_weight: 0.1
soft_recovery_topk: 8
soft_recovery_sigma_scale: 1.0
soft_recovery_only_wrong_prefix: True

textaudio_emb_freeze: False
varying_frame_length: False
align_first_frame_yaw: True

# Kept equal to the released all-speaker recipe. The percentage-based C2F
# schedule uses this run horizon, so shorten this deliberately for pilot runs.
pretrain_warmup_epochs: 50
epochs: 10000
decay_epochs: 500
test_period: 20
decay_rate: 0.8
log_period: 25
